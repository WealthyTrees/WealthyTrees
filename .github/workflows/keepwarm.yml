name: Keep Live Wire fresh
# Visits the site every 30 minutes so Sprout's stories refresh even when no visitor is on the page.
# Free: a few seconds of GitHub time per run.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the news feed
        run: |
          curl -fsS -m 60 -o /dev/null "https://wealthytrees.online/api/pulse" || echo "ping failed (will retry next time)"
