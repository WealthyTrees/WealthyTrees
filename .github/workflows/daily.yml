name: Daily brief
on:
  schedule:
    - cron: "30 0 * * *"    # 6:00 AM IST  (Morning Edition)
    - cron: "30 6 * * *"    # 12:00 PM IST (Afternoon Edition)
    - cron: "30 12 * * *"   # 6:00 PM IST  (Night Edition)
  workflow_dispatch:        # lets you run it by hand
permissions:
  contents: write
concurrency:
  group: brief
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_brief.py
      - name: Check chart data (keeps last good file if bad)
        run: python scripts/validate_data.py || { echo "::warning::charts.json failed the check, keeping the last good file"; git checkout -- data/charts.json; }
      - name: Commit changes
        if: always()
        run: |
          git config user.name "wealthytrees-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Brief update" && git pull --rebase && git push)
