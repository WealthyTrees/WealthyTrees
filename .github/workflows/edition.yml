name: THE 9:15 edition
on:
  schedule:
    - cron: "45 1 * * 1-5"   # 7:15 AM IST, Mon-Fri (GitHub may delay; 8:30 publish still safe)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: edition
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_edition.py
      - name: Commit
        run: |
          git config user.name "wealthytrees-bot"
          git config user.email "bot@users.noreply.github.com"
          git add pages/the-915.html edition
          git diff --cached --quiet || (git commit -m "THE 9:15 edition" && git pull --rebase && git push)
