name: Site health check
# Every 3 hours: checks that the news, Sprout (with Explain simply) and the main pages work.
# If anything fails, this run turns red and GitHub emails you. Free.
on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Sprout, headlines and pages
        run: |
          S=https://wealthytrees.online
          P=$(curl -fsS -m 60 "$S/api/pulse")
          echo "$P" | jq -e '.ai == true and (.stories|length) >= 3 and ([.stories[]|select(.simple)]|length) >= 3' >/dev/null || { echo "Sprout has no AI stories with Explain simply"; exit 1; }
          curl -fsS -m 30 "$S/api/headlines" | jq -e '(.items|length) >= 5' >/dev/null || { echo "Too few headlines"; exit 1; }
          curl -fsS -m 30 "$S/api/quotes" | jq -e '(.quotes|length) >= 12 and ([.quotes[]|select(.price > 0)]|length) == (.quotes|length)' >/dev/null || { echo "Live prices missing or broken"; exit 1; }
          curl -fsS -m 30 -o /dev/null "$S/api/health" || { echo "Health check failed"; exit 1; }
          for p in "" pages/markets.html pages/learn.html learn-1.html learn-2.html pages/about.html; do
            curl -fsS -m 30 -o /dev/null "$S/$p" || { echo "Page failed: /$p"; exit 1; }
          done
          echo "All good"
