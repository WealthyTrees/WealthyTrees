<style>
.aura{animation:aura 4.2s ease-in-out infinite;transform-origin:100px 92px}
.sway{animation:sway 6s ease-in-out infinite;transform-origin:100px 130px}
.coin{animation:tw 2.8s ease-in-out infinite;animation-delay:var(--d)}
.fall{animation:fall 4s ease-in infinite;animation-delay:var(--d);opacity:0}
.sp{animation:sp 2.4s ease-in-out infinite;animation-delay:var(--d)}
@keyframes aura{50%{transform:scale(1.12);opacity:.8}}
@keyframes sway{50%{transform:rotate(1.8deg)}}
@keyframes tw{50%{transform:scale(1.14);filter:brightness(1.25)}}
@keyframes fall{0%{opacity:0;transform:translateY(-34px)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(46px)}}
@keyframes sp{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1.2)}}
@media (prefers-reduced-motion:reduce){.aura,.sway,.coin,.fall,.sp{animation:none}.fall{opacity:0}}
</style>
